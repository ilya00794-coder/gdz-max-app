<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 230" font-family="system-ui, sans-serif" font-size="11">
  <rect x="0" y="0" width="300" height="230" fill="#1B2437" rx="10"/>
  <!-- ковш Большой Медведицы: Алькаид→Мицар→Алиот→Мегрец→Фекда→Мерак, Мегрец→Дубхе, Дубхе→Мерак -->
  <g stroke="#9FB4D8" stroke-width="1">
    <polyline points="36,150 74,138 108,142 146,132 152,176 202,186 196,138" fill="none"/>
    <line x1="146" y1="132" x2="196" y2="138"/>
  </g>
  <g fill="#EFE8C8">
    <circle cx="36" cy="150" r="3.4"/><circle cx="74" cy="138" r="3.4"/><circle cx="108" cy="142" r="3.4"/>
    <circle cx="146" cy="132" r="3.4"/><circle cx="152" cy="176" r="3.4"/><circle cx="202" cy="186" r="3.4"/>
    <circle cx="196" cy="138" r="3.8"/>
  </g>
  <!-- линия от передней стенки ковша (Мерак→Дубхе) к Полярной, ~5 расстояний -->
  <line x1="202" y1="186" x2="196" y2="138" stroke="#D8A13A" stroke-width="1.2"/>
  <line x1="196" y1="138" x2="188" y2="52" stroke="#D8A13A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="188" cy="52" r="4.6" fill="#FFF3B0"/>
  <g fill="#C9D4EA">
    <text x="24" y="170">ручка ковша</text>
    <text x="150" y="202">ковш</text>
    <text x="204" y="132">две крайние звезды ковша</text>
  </g>
  <text x="198" y="46" fill="#FFF3B0" font-weight="bold">Полярная звезда</text>
  <text x="14" y="24" fill="#C9D4EA">Большая Медведица — ковш из 7 звёзд</text>
  <text x="14" y="220" fill="#9FB4D8" font-size="10">Продли линию через две крайние звезды ковша ≈ на 5 таких расстояний — попадёшь в Полярную. Она указывает на север.</text>
</svg>
