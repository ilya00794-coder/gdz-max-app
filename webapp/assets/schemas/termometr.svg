<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" font-family="system-ui, sans-serif" font-size="11">
  <!-- шкала -->
  <g stroke="#5B5A54" stroke-width="1">
    <line x1="120" y1="20" x2="120" y2="190"/>
    <g text-anchor="end" fill="#5B5A54">
      <line x1="112" y1="30" x2="128" y2="30"/><text x="108" y="34">40</text>
      <line x1="114" y1="50" x2="126" y2="50"/><text x="108" y="54">30</text>
      <line x1="114" y1="70" x2="126" y2="70"/><text x="108" y="74">20</text>
      <line x1="114" y1="90" x2="126" y2="90"/><text x="108" y="94">10</text>
      <line x1="110" y1="110" x2="130" y2="110"/><text x="108" y="114" font-weight="bold">0</text>
      <line x1="114" y1="130" x2="126" y2="130"/><text x="108" y="134">-10</text>
      <line x1="114" y1="150" x2="126" y2="150"/><text x="108" y="154">-20</text>
      <line x1="114" y1="170" x2="126" y2="170"/><text x="108" y="174">-30</text>
    </g>
  </g>
  <!-- трубка со столбиком жидкости (показывает +15) -->
  <rect x="133" y="24" width="10" height="172" rx="5" fill="none" stroke="#5B5A54" stroke-width="1.4"/>
  <rect x="136" y="80" width="4" height="118" fill="#B54141"/>
  <!-- резервуар -->
  <circle cx="138" cy="205" r="13" fill="#B54141" stroke="#5B5A54" stroke-width="1.4"/>
  <!-- подписи частей -->
  <g fill="#185FA5">
    <text x="160" y="40">трубка с жидкостью</text><line x1="145" y1="46" x2="157" y2="40" stroke="#185FA5" stroke-width="0.8"/>
    <text x="40" y="20">шкала (градусы, °C)</text><line x1="112" y1="26" x2="100" y2="20" stroke="#185FA5" stroke-width="0.8"/>
    <text x="163" y="210">резервуар с жидкостью</text><line x1="151" y1="207" x2="160" y2="207" stroke="#185FA5" stroke-width="0.8"/>
    <text x="160" y="114">ноль градусов — граница</text>
    <text x="160" y="127">мороза и тепла</text>
    <line x1="131" y1="110" x2="157" y2="110" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 2"/>
  </g>
  <text x="20" y="234" fill="#8B8A84">Выше нуля — тепло (столбик над чертой 0), ниже нуля — мороз.</text>
</svg>
