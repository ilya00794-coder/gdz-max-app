  <!-- листья -->
  <path d="M150 120 C122 116 112 100 116 92 C136 92 148 104 150 120 Z" fill="#6FA05B" stroke="#4E7C3F"/>
  <path d="M150 96 C178 92 188 76 184 68 C164 68 152 80 150 96 Z" fill="#6FA05B" stroke="#4E7C3F"/>
  <!-- цветок -->
  <g fill="#D8A13A" stroke="#B07E20">
    <circle cx="150" cy="46" r="7"/><circle cx="138" cy="52" r="7"/><circle cx="162" cy="52" r="7"/>
    <circle cx="142" cy="38" r="7"/><circle cx="158" cy="38" r="7"/>
  </g>
  <circle cx="150" cy="46" r="5.5" fill="#8A5A22"/>
  <!-- подписи -->
  <g fill="#185FA5">
    <text x="196" y="46">цветок</text><line x1="171" y1="46" x2="193" y2="44" stroke="#185FA5" stroke-width="0.8"/>
    <text x="196" y="76">лист</text><line x1="184" y1="72" x2="193" y2="73" stroke="#185FA5" stroke-width="0.8"/>
    <text x="196" y="118">стебель</text><line x1="152" y1="118" x2="193" y2="115" stroke="#185FA5" stroke-width="0.8"/>
    <text x="196" y="196">корень</text><line x1="172" y1="198" x2="193" y2="194" stroke="#185FA5" stroke-width="0.8"/>
  </g>
  <text x="16" y="230" fill="#8B8A84" font-size="10">Корень — в почве; стебель, листья и цветок — над почвой.</text>
