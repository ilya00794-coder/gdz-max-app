  <text x="248" y="156" fill="#8B8A84" font-size="10">почва</text>
  <!-- корень -->
  <g stroke="#8A6B3F" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="150" y1="160" x2="150" y2="205"/>
    <path d="M150 172 L128 194"/><path d="M150 176 L170 200"/><path d="M150 188 L136 208"/>
  </g>
  <!-- стебель -->
