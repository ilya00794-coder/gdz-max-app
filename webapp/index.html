<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Решебник — MAX mini app</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <!-- KaTeX: решение приходит с бэкенда с формулами в LaTeX ($...$), их надо отрисовать,
       а не показывать школьнику сырые $ и \dfrac{}{}. -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.4/katex.min.css"
        integrity="sha512-CjgvIbfXwhzjOCtP+wuQMPGJZ5uEY2kHZ4qPGvjIgfkTiFdnuDmF+oJW2B5glj7d7OkPPDX9BMu4hDio5MWTEA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    MAX Bridge — https://dev.max.ru/docs/webapps/bridge
    Скрипт создаёт глобальный window.WebApp; отдельной инициализации не требует.
    Вне клиента MAX (обычный браузер) объект не появится — app.js это переживает
    и переключается в режим автономного превью.
  -->
  <script src="https://st.max.ru/js/max-web-app.js"></script>

  <div class="app">

    <!-- Экран 1: выбор класса и предмета -->
    <section class="screen screen-light" id="screen-setup" data-active="true">
      <header class="brand-topbar">
        <img class="brand-logo" src="assets/logo-header.svg" alt="домашка в max" />
      </header>

      <div class="setup">
        <p class="setup-lead">Сфотографируй задачу — покажем решение по шагам.</p>

        <h1 class="setup-title">Класс</h1>
        <div class="chip-row" id="grade-row"></div>

        <h2 class="setup-title">Предмет</h2>
        <div class="chip-row" id="subject-row"></div>

        <button class="cta" id="btn-to-capture" disabled>Дальше</button>
      </div>
    </section>

    <!-- Экран 2: фото задачи -->
    <section class="screen screen-light" id="screen-capture" data-active="false">
      <header class="brand-topbar brand-topbar--back">
        <button class="sheet-back" id="btn-back-setup" aria-label="Назад">←</button>
        <img class="brand-logo" src="assets/logo-header.svg" alt="домашка в max" />
      </header>

      <div class="capture">
        <label class="capture-frame" for="file-input">
          <svg class="capture-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
               stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8a2 2 0 0 1 2-2h1.6l1-1.6h6.8l1 1.6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />
            <circle cx="12" cy="12.5" r="3.2" />
          </svg>
          <p class="capture-hint">Сфотографируй задачу из учебника</p>
          <p class="capture-sub">Можно добавить несколько снимков</p>
        </label>

        <div class="thumb-row" id="thumb-row"></div>

        <div class="capture-actions">
          <label class="cta cta-outline" for="file-input">+ Фото</label>
          <input type="file" id="file-input" accept="image/*" capture="environment" multiple hidden />
          <button class="cta" id="btn-solve">Решить</button>
        </div>
      </div>
    </section>

    <!-- Экран 3: подтверждение распознанного текста -->
    <section class="screen screen-light" id="screen-confirm" data-active="false">
      <header class="brand-topbar brand-topbar--back">
        <button class="sheet-back" id="btn-back-capture" aria-label="Назад">←</button>
        <img class="brand-logo" src="assets/logo-header.svg" alt="домашка в max" />
      </header>

      <div class="confirm">
        <h1 class="confirm-title">Проверь условие</h1>
        <p class="confirm-lead">Так мы прочитали задачу. Поправь, если что-то распозналось неверно.</p>
        <textarea class="recognized-text" id="recognized-text"
                  placeholder="Введи условие задачи своими словами…"></textarea>
        <button class="cta" id="btn-confirm">Верно, решай →</button>
      </div>
    </section>

    <!-- Экран 4: решение — светлый стиль A, всё решение одним списком (docs/design-spec.md) -->
    <section class="screen screen-light" id="screen-solution" data-active="false">
      <header class="sheet-topbar">
        <button class="sheet-back" id="btn-back-confirm" aria-label="Назад">←</button>
        <span class="sheet-title">Решение</span>
        <span class="sheet-task" id="solution-task"></span>
      </header>

      <div class="sheet-scroll">
        <ol class="steps" id="steps-list"></ol>
        <div class="answer-block" id="answer-block"></div>
      </div>

      <div class="sheet-actions">
        <button class="btn-light" id="btn-new-task">Новая задача</button>
        <button class="btn-light btn-report" id="btn-report">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 5v16M5 5h11l-2 4 2 4H5" />
          </svg>
          Ошибка в ответе
        </button>
      </div>
    </section>

  </div>

  <!-- Обычные (не defer) скрипты: KaTeX и auto-render должны быть готовы к моменту загрузки app.js. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.4/katex.min.js"
          integrity="sha512-xOYqegYY5pn2pdG9rJHu1MztSz15rwav1XS1Y7ccfLUD9oJcTIh4XOSo+Pj5BrWvYgU448s2s1XEZogXHQOLCw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.4/contrib/auto-render.min.js"
          integrity="sha512-0HzJcHCD+wBh9kNUUcm3DWH9IbNDfudsYyMD5EHwSuFK6aEsaa/UEPqqk4t0pm4bbmwR6A11yNsD7Q+nz6XF+Q=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
